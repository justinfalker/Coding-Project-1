<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="page">
    <form id="feedback-form">
      <label for="name">Name:</label><br>
      <input type="text" id="name"><br>
      <small id="name-error"></small><br>

      <label for="email">Email:</label><br>
      <input type="text" id="email"><br>
      <small id="email-error"></small><br>

      <label for="comments">Comments:</label><br>
      <textarea id="comments"></textarea><br>
      <small id="comments-error"></small><br>

      <p id="char-count">Character count: 0</p>
      <p id="tooltip"></p>

      <button type="submit">Submit</button>
    </form>

    <h2>Feedback Display</h2>
    <div id="feedback-display"></div>
  </div>

  <script src="cp_1.js"></script>
</body>
</html>
